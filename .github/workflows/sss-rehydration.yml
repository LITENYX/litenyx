name: Litenyx SSS Rehydration Gate

# Fail-closed SSS-REHYDRATION-CONTRACT-v0.2 gate. Reproduces the repository's
# `make sss-rehydration-test` contract in a clean Linux CI environment that can
# build the pinned debug dogecoind (the local Windows/MSYS2 host cannot: no
# make/autotools/BDB).
#
# Contract (deploy/Makefile `sss-rehydration-test`):
#   pin e0a1c157 (Dogecoin v1.14.9) -> inject-hooks (NOW incl. litenyx-rehydrate
#   .patch: wires LitenyxRehydrateSharedSpendSet into AppInitMain end-of-Phase-7)
#   -> production-build-debug (NO -DNDEBUG; rehydration runs in every build) ->
#   test_litenyx_cold_restart.py single-file run (SKIP or FAIL => gate fails) ->
#   verdict.
#
# This is a DISTINCT gate from m3-integration (G1-G3) and regtest-test
# (split/merge). It proves a separate invariant: the live LitenyxSharedSpendSet
# is deterministically reconstructed on daemon restart by REPLAY of canonical
# chain history (derivation), not serialization.
#
# This workflow only adds BUILD/RUN infrastructure. It changes no protocol
# design, no frozen consensus semantics, and no production consensus code.

on:
  push:
    branches: [phase7-draining-authority, main]
  pull_request:
    branches: [phase7-draining-authority, main]
  workflow_dispatch:

# Ensure only one rehydration gate runs per branch: a new push/PR update cancels
# any in-flight run, preventing parallel/duplicate gate executions.
concurrency:
  group: sss-rehydration-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sss-rehydration-gate:
    # Reproduce the exact Dogecoin Core v1.14.9-compatible toolchain inside an
    # ubuntu:20.04 container (glibc 2.31 + Boost 1.71), identical to the M3 gate.
    # CI toolchain pin only; no Dogecoin or Litenyx source is modified.
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
      CXX: g++-10
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build deps (Dogecoin + boost + pytest)
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          install_deps() {
            for i in 1 2 3 4 5; do
              if [ "$i" -ge 3 ]; then
                echo "Switching to fallback mirror us.archive.ubuntu.com (attempt $i)"
                sed -i 's|archive\.ubuntu\.com|us.archive.ubuntu.com|g' /etc/apt/sources.list
              fi
              apt-get update
              if apt-get install -y \
                git \
                build-essential libtool autotools-dev automake pkg-config \
                bsdmainutils python3 python3-pip libssl-dev libevent-dev \
                libboost-all-dev \
                libboost-test-dev libboost-thread-dev libboost-chrono-dev \
                libminiupnpc-dev libzmq3-dev libsqlite3-dev libdb++-dev libfmt-dev \
                g++-10; then
                return 0
              fi
              echo "apt-get attempt $i failed, retrying in 60s..."
              sleep 60
            done
            echo "ERROR: All apt-get attempts failed."
            return 1
          }
          install_deps
          python3 -m pip install --upgrade pip pytest

      - name: Clone Dogecoin base (pin e0a1c157)
        working-directory: deploy
        run: make clone-dogecoin

      - name: Run fail-closed SSS rehydration gate (debug daemon + cold restart)
        working-directory: deploy
        run: |
          # Fail-closed: capture make's exit code and propagate it.
          rc=0
          if make sss-rehydration-test > /tmp/sss_gate_console.log 2>&1; then :; else rc=$?; fi
          cat /tmp/sss_gate_console.log
          exit $rc

      - name: Upload SSS rehydration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Litenyx-sss-rehydration-report
          path: |
            /tmp/sss_rehydration_report.txt
            /tmp/sss_gate_console.log
